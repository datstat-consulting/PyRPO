[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PyRPO"
version = "1.1.0"
authors = [{name = "Adriel Ong", email = "adriel_datstat@zohomail.com"}, {name = "Azriel Cais Baluyut"}, {name = "Jowi Rapha Cruz"}]
description = "Portfolio optimization with robust mean estimates, CVaR and walk-forward evaluation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "cvxpy>=1.4"]

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools]
py-modules = ["PyRPO"]
